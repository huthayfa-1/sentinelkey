name: Debug Secrets
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secret Availability
        env:
          MY_SECRET: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "Secret DISCORD_WEBHOOK_URL is EMPTY or MISSING."
          else
            echo "Secret DISCORD_WEBHOOK_URL is PRESENT (len=${#MY_SECRET})."
          fi
