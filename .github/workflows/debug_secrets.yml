name: Debug Secrets
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check Secret Availability
        env:
          MY_SECRET: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MY_VAR: ${{ vars.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$MY_SECRET" ]; then
            echo "FOUND in Secrets! (len=${#MY_SECRET})"
          elif [ -n "$MY_VAR" ]; then
             echo "FOUND in Variables! (len=${#MY_VAR})"
             echo "::error::Found in Variables tab. Please move it to the Secrets tab!"
          else
            echo "MISSING from both Secrets and Variables."
            echo "Please ensure you added it to 'Repository secrets' and NOT 'Environment secrets'."
          fi
