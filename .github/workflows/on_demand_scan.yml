name: On-Demand Scanner
on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: 'URL of the repository to scan (e.g., https://github.com/user/repo)'
        required: true

jobs:
  scan-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SentinelKey (For Tools)
        uses: actions/checkout@v3

      - name: Checkout Target Repository
        run: |
          git clone ${{ inputs.target_repo_url }} target_code

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks Scan
        id: gitleaks
        run: |
          cd target_code
          gitleaks detect --source . --report-format json --report-path ../results.json --no-git || echo "SECRETS_FOUND=true" >> $GITHUB_ENV # pragma: allowlist secret
          cat ../results.json || echo "[]"
      
      - name: Alert on Secrets Found
        if: env.SECRETS_FOUND == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}  # pragma: allowlist secret
        run: |
          pip install requests python-dotenv
          python notifier.py --ci --input results.json

      - name: Update History
        if: always()
        run: |
          # Create simple python script to append JSON
          cat <<EOF > update_history.py
          import json
          from datetime import datetime
          import os

          try:
              if os.path.exists('scan_history.json'):
                  with open('scan_history.json', 'r') as f:
                      history = json.load(f)
              else:
                  history = []
              
              new_results = []
              if os.path.exists('results.json'):
                  with open('results.json', 'r') as f:
                      try:
                          content = f.read().strip()
                          if content:
                              new_results = json.loads(content)
                      except json.JSONDecodeError:
                          pass
              
              entry = {
                  "timestamp": datetime.now().isoformat(),
                  "repo": "${{ inputs.target_repo_url }}",
                  "results": new_results
              }
              
              history.append(entry)
              
              with open('scan_history.json', 'w') as f:
                  json.dump(history, f, indent=2)
          except Exception as e:
              print(f"Error updating history: {e}")
          EOF
          
          python update_history.py

      - name: Commit History
        if: always()
        run: |
          git config --global user.name 'SentinelKey Bot'
          git config --global user.email 'bot@sentinelkey'
          git add scan_history.json
          git commit -m "Auto: Update scan history" || exit 0
          git push
