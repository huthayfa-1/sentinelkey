name: On-Demand Scanner
on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: 'URL of the repository to scan (e.g., https://github.com/user/repo)'
        required: true

jobs:
  scan-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SentinelKey (For Tools)
        uses: actions/checkout@v3

      - name: Checkout Target Repository
        run: |
          git clone ${{ inputs.target_repo_url }} target_code

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: TruffleHog Scan
        id: trufflehog
        run: |
          cd target_code
          trufflehog git file://./ --config ../trufflehog.yaml --fail --json > ../results.json 2>&1 || echo "SECRETS_FOUND=true" >> $GITHUB_ENV # pragma: allowlist secret
          cat ../results.json
      
      - name: Alert on Secrets Found
        if: env.SECRETS_FOUND == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}  # pragma: allowlist secret
        run: |
          pip install requests python-dotenv
          python notifier.py --ci
