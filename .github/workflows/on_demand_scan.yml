name: On-Demand Scanner
on:
  workflow_dispatch:
    inputs:
      target_repo_url:
        description: 'URL of the repository to scan (e.g., https://github.com/user/repo)'
        required: true

permissions:
  contents: write

jobs:
  scan-external:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SentinelKey (For Tools)
        uses: actions/checkout@v3

      - name: Checkout Target Repository
        run: |
          git clone ${{ inputs.target_repo_url }} target_code

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Gitleaks Scan
        id: gitleaks
        run: |
          cd target_code
          gitleaks detect --source . --report-format json --report-path ../results.json --no-git || echo "SECRETS_FOUND=true" >> $GITHUB_ENV # pragma: allowlist secret
          cat ../results.json || echo "[]"
      
      - name: Alert on Secrets Found
        if: env.SECRETS_FOUND == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}  # pragma: allowlist secret
        run: |
          pip install requests python-dotenv
          python notifier.py --ci --input results.json

      - name: Save to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TARGET_REPO_URL: ${{ inputs.target_repo_url }}
        run: |
          pip install supabase
          python save_to_supabase.py
